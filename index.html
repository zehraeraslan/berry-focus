<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berry Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#FFB3C7"/><stop offset="1" stop-color="#FF6F91"/></linearGradient>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#fff"/></symbol>
<symbol id="gem" viewBox="0 0 24 24"><path d="M6 3h12l5 7-11 12L1 10Z" fill="url(#gg)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M1 10h22M6 3l6 7 6-7M12 10v12" fill="none" stroke="#fff" stroke-width=".9" opacity=".85"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21C4 14 2 10 2 7a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3-2 7-10 14Z" fill="url(#gg)" stroke="#fff" stroke-width="1.2"/><path d="M6 6c1-1.500 3-1.500 4 0" stroke="#fff" stroke-width="1.200" fill="none" stroke-linecap="round"/></symbol>
<symbol id="bow" viewBox="0 0 24 24"><path d="M12 12C8 4 1 5 2 11s7 4 10 1c3 3 9 5 10-1s-6-7-10 1Z" fill="url(#gg)" stroke="#fff" stroke-width="1.200" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.600" fill="#FF6F91" stroke="#fff" stroke-width="1"/></symbol>
<symbol id="cherry" viewBox="0 0 24 24"><path d="M8 16C9 9 12 5 18 3M16 17C15 11 15 7 18 3" stroke="#6FA35B" stroke-width="1.600" fill="none" stroke-linecap="round"/><circle cx="8" cy="17" r="5" fill="#E8466C" stroke="#fff" stroke-width="1"/><circle cx="16" cy="18" r="5" fill="#E8466C" stroke="#fff" stroke-width="1"/><circle cx="6.500" cy="15.500" r="1.300" fill="#fff"/><circle cx="14.500" cy="16.500" r="1.300" fill="#fff"/></symbol>
</defs></svg>
<div class="deco" aria-hidden="true">
<svg class="tw" style="--s:22px;left:4%;top:10%"><use href="#star"/></svg>
<svg class="tw" style="--s:16px;left:20%;top:4%;animation-delay:1.2s"><use href="#star"/></svg>
<svg class="tw" style="--s:26px;left:47%;top:7%;animation-delay:.6s"><use href="#star"/></svg>
<svg class="tw" style="--s:18px;left:93%;top:16%;animation-delay:2s"><use href="#star"/></svg>
<svg class="tw" style="--s:20px;left:8%;top:62%;animation-delay:1.7s"><use href="#star"/></svg>
<svg class="tw" style="--s:24px;left:88%;top:70%;animation-delay:.9s"><use href="#star"/></svg>
<svg class="tw" style="--s:14px;left:55%;top:92%;animation-delay:2.4s"><use href="#star"/></svg>
<svg class="fl" style="--s:34px;left:2%;top:36%"><use href="#gem"/></svg>
<svg class="fl" style="--s:30px;left:94%;top:44%;animation-delay:1.5s"><use href="#gem"/></svg>
<svg class="fl" style="--s:28px;left:30%;top:90%;animation-delay:3s"><use href="#heart"/></svg>
<svg class="fl" style="--s:32px;left:75%;top:3%;animation-delay:2.2s"><use href="#bow"/></svg>
<svg class="fl" style="--s:34px;left:3%;top:84%;animation-delay:.8s"><use href="#cherry"/></svg>
<svg class="fl" style="--s:26px;left:90%;top:90%;animation-delay:3.6s"><use href="#heart"/></svg>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>

</html>
